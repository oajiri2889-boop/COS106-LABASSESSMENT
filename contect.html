<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <header>

      <a href="index.html" class="logo">Alex Johnson</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>

        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 style="margin-bottom: 1.5rem;">Contact Me</h1>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form id="contact-form" novalidate>
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe">
          <span class="error-msg" id="name-error">Full name is required.</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com">
          <span class="error-msg" id="email-error">Please enter a valid email address.</span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" placeholder="08012345678">
          <span class="error-msg" id="phone-error">Phone number must contain digits only.</span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message..."></textarea>
          <span class="error-msg" id="message-error">Message field cannot be empty.</span>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
